<script src="{{ base_path }}/assets/js/main.min.js"></script>
<script>
(function() {
  function closeAll() {
    document.querySelectorAll('.author__urls-wrapper.is-open').forEach(function(wrapper) {
      wrapper.classList.remove('is-open');
    });
  }

  function closeContactPopovers() {
    document.querySelectorAll('.contact-popover').forEach(function(popover) {
      popover.hidden = true;
    });
  }

  function init() {
    document.querySelectorAll('.author__urls-wrapper').forEach(function(wrapper) {
      var button = wrapper.querySelector('button');
      var list = wrapper.querySelector('.author__urls');
      if (!button || !list) return;

      button.addEventListener('click', function(event) {
        event.preventDefault();
        event.stopPropagation();
        wrapper.classList.toggle('is-open');
      });

      wrapper.querySelectorAll('.contact-trigger').forEach(function(trigger) {
        trigger.addEventListener('click', function(event) {
          event.preventDefault();
          event.stopPropagation();
          var popover = trigger.parentElement.querySelector('.contact-popover');
          var wasHidden = popover.hidden;
          closeContactPopovers();
          popover.hidden = !wasHidden;
        });
      });

      wrapper.querySelectorAll('[data-copy-contact]').forEach(function(copyButton) {
        copyButton.addEventListener('click', function(event) {
          event.preventDefault();
          var value = copyButton.closest('.contact-popover').querySelector('.contact-popover__value').textContent.trim();
          navigator.clipboard.writeText(value).then(function() {
            copyButton.textContent = 'Copied';
            window.setTimeout(function() { copyButton.textContent = 'Copy'; }, 1200);
          });
        });
      });
    });

    document.addEventListener('click', function() {
      closeAll();
      closeContactPopovers();
    });

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') closeAll();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
